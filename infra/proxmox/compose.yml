# =============================================================================
# Proxmox VE em container — Laboratório de Testes do KSC 16.x
# Baseado em dockurr/proxmox (https://github.com/dockur/proxmox)
#
# Uso:
#   podman compose --env-file ~/.secrets/ksc-proxmox.env \
#     -f infra/proxmox/compose.yml up -d
#
# A senha do root do Proxmox nunca é commitada: vem de ~/.secrets/ksc-proxmox.env
# =============================================================================

# O nome do projeto é fixado porque o diretório deste arquivo (infra/proxmox) é
# o mesmo de outros laboratórios no host: sem isto, o compose adota "proxmox"
# como nome de projeto e tenta recriar os containers do laboratório alheio.
name: ksc-lab

services:
  proxmox:
    image: dockurr/proxmox:9.2.10
    container_name: ksc-proxmox
    hostname: pve-ksc
    environment:
      PASSWORD: ${PROXMOX_PASSWORD:?Defina PROXMOX_PASSWORD no arquivo ~/.secrets/ksc-proxmox.env}
    ports:
      # Interface Web do Proxmox VE
      - "127.0.0.1:8006:8006"
      # Portas publicadas no host e repassadas para a VM de testes (${KSC_VM_IP}):
      - "127.0.0.1:2222:2222"     # -> VM:22 (SSH para automação e terminal)
      - "127.0.0.1:8443:8443"     # -> VM:443 (Web Console HTTPS do KSC)
      - "127.0.0.1:8080:8080"     # -> VM:8080 (Web Console HTTP/Alternative)
      - "127.0.0.1:13291:13291"   # -> VM:13291 (KSC Administration Server API)
      - "127.0.0.1:13000:13000"   # -> VM:13000 (Kaspersky Network Agent SSL)
      - "127.0.0.1:14000:14000"   # -> VM:14000 (Kaspersky Network Agent Plain/Non-SSL)
      - "127.0.0.1:5432:5432"     # -> VM:5432 (PostgreSQL 16)
    volumes:
      - ksc_proxmox_data:/var/lib/vz
      - ksc_proxmox_config:/var/lib/pve-cluster
    devices:
      - /dev/kvm
    # Sem group_add: "keep-groups" é sintaxe do podman run e falha quando o
    # compose roda através do provider docker-compose. Sob Podman rootless o
    # acesso a /dev/kvm vem da ACL do dispositivo no host.
    privileged: true
    restart: unless-stopped
    stop_grace_period: 2m

  # ---------------------------------------------------------------------------
  # Sidecars socat para repasse de portas para a VM Rocky Linux 9
  # IP da VM deve ser fornecido via KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env
  # Compartilham o network_mode com o container do proxmox.
  # ---------------------------------------------------------------------------

  forward-ssh:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-ssh
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:2222,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:22"]

  forward-ksc-web-ssl:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-web-ssl
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:8443,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:443"]

  forward-ksc-web-http:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-web-http
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:8080"]

  forward-ksc-admin-api:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-admin-api
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:13291,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:13291"]

  forward-ksc-agent-ssl:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-agent-ssl
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:13000,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:13000"]

  forward-ksc-agent-plain:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-agent-plain
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:14000,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:14000"]

  forward-ksc-postgres:
    image: alpine/socat:1.8.0.0
    container_name: ksc-forward-postgres
    network_mode: "service:proxmox"
    depends_on: [proxmox]
    restart: unless-stopped
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:${KSC_VM_IP:?Defina KSC_VM_IP no arquivo ~/.secrets/ksc-proxmox.env}:5432"]

volumes:
  ksc_proxmox_data:
  ksc_proxmox_config:
